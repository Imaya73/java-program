<html>
<head>
<title>Bitwise Operator</title>
</head>
<body>
<script type="text/javascript">
var a=60;
var b=13;
var c;
var lb="<br/>";
c=(a&b);
document.write("c=",c,lb);
c=(a|b);
document.write("c=",c,lb);
c=(a^b);
document.write("c=",c,lb);
c=(~a);
document.write("c=",c,lb);
c=(a<<2);
document.write("c=",c,lb);
c=(a>>2);
document.write("c=",c,lb);
</script>
</body>
</html>
