<html>
<head>
<title>Comparision Operator</title>
</head>
<body>
<script type="text/javascript">
var a=10;
var b=20;
var c;
var lb="<br/>";
c=(a==b);
document.write("c=",c,lb);
c=(a!=b);
document.write("c=",c,lb);
c=(a>b);
document.write("c=",c,lb);
c=(a<b);
document.write("c=",c,lb);
c=(a>=b);
document.write("c=",c,lb);
c=(a<=b);
document.write("c=",c,lb);
</script>
</body>
</html>
