<!DOCTYPE html>
<html>
<head>
    <style>
        div.background {
            background: url("nature.jpg") repeat;
            border: 2px solid black;
            padding: 30px;
        }

        div.transbox {
            margin: 30px;
            background-color: antiquewhite;
            border: 1px solid black;
            opacity: 0.6;
            filter: alpha(opacity=60);
            padding: 20px;
        }

        div.transbox p {
            margin: 0;
            font-weight: bold;
            color: black;
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="transbox">
            <p>
                This is the text inside the transparent box.  
                You can write anything you want here!
            </p>
        </div>
    </div>
</body>
</html>
