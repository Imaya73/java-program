<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Page</title>

  <style>
    body {
      background-color: #f0f8ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    fieldset {
      width: 400px;
      margin: 50px auto;
      border: 3px solid #6a5acd;
      border-radius: 10px;
      background-color: #ffffff;
      padding: 20px;
      text-align: left;
    }

    legend {
      font-size: 20px;
      font-weight: bold;
      color: #6a5acd;
    }

    label {
      color: #333333;
      font-weight: bold;
    }

    input, select, textarea {
      width: 95%;
      padding: 6px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6a5acd;
      background-color: #f5f3ff;
      outline: none;
    }

    input[type="submit"], input[type="reset"] {
      width: 48%;
      background-color: #6a5acd;
      color: white;
      font-weight: bold;
      border: none;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    input[type="submit"]:hover, input[type="reset"]:hover {
      background-color: #5b4db8;
    }

    h2 {
      color: #483d8b;
    }
  </style>
</head>

<body>
  <h2>Student Registration Form</h2>

  <form onsubmit="alert('Registered Successfully!')">
    <fieldset>
      <legend>Personal Details</legend>

      <label>Full Name:</label><br>
      <input type="text" name="fullname" placeholder="Enter your full name" required><br><br>

      <label>Email:</label><br>
      <input type="email" name="email" placeholder="Enter your email" required><br><br>

      <label>Password:</label><br>
      <input type="password" name="password" placeholder="Enter your password" required><br><br>

      <label>Phone Number:</label><br>
      <input type="tel" name="phone" placeholder="Enter your phone number"><br><br>

      <label>Gender:</label><br>
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female"> Female<br><br>

      <label>Date of Birth:</label><br>
      <input type="date" name="dob"><br><br>
    </fieldset>

    <fieldset>
      <legend>Course Details</legend>

      <label>Select Course:</label><br>
      <select name="course">
        <option value="">--Choose--</option>
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>Python</option>
      </select><br><br>

      <label>Why do you want to join this course?</label><br>
      <textarea rows="3" placeholder="Write a short answer..."></textarea><br><br>
      <input type="submit" value="Register">
      <input type="reset" value="Reset">
    </fieldset>
  </form>
</body>
</html>
