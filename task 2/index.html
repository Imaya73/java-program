<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <style>
            ul{
                list-style: none;
                display: flex; 
                justify-content: center;
                align-items: center;
                overflow: hidden;
                background-color:rgb(77, 3, 120);
                position: sticky;
                top: 0%;
                padding: 0%;
                margin: 0%;
                z-index: 1000;
            }
            li{
                
                padding: 18px;
                margin: 0 8px;
            

            }
            li a{
                text-decoration: none;
                color:antiquewhite;
                font-weight: bold;
            }
            .header{
                 height: 60vh;
                 display: flex;
                 flex-direction: column;
                 justify-content: center;
                 text-align: center;
                 align-items: center;
                 background-color: rgb(120, 20, 200);
                 color: white;
                 padding:20px; 
                 
            }
            .header h1{
                font-size: 3rem;
                margin-bottom: 10px;
            }
            .header p{
                font-size: 1.2rem;
                margin: 20px;
            }
            .header-buttons button{
                margin: 0 10px;
                padding: 8px 15px;
                font-size: 1rem;
                background-color: gold;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            
            .header-buttons button:hover {
                background-color: orange;
            }
            nav ul {
                list-style: none;
                display: flex; 
                justify-content: center; 
                align-items: center;
                background-color: rgb(77, 3, 120);
                padding: 0;
                margin: 0;
            }
            nav ul li{
                padding: 15px 20px;
            }
            nav ul li a{
                text-decoration: none;
                color: antiquewhite;
                font-weight: bold;
                font-size: 1rem;
            }
            nav ul li a:hover{
                color: gold;
            }
        </style>
        </head>

<body>
    <header class="header">
        <div class="medal"></div>
        <h1>🏅SPORTS ZONE🏅</h1>
        <p>Play Hard • Stay Fit • Win Big</p>
        <div class="header-buttons">
            <button>Explore Sports</button>
            <button>View Events</button>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Sports</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Team</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>

</html>
