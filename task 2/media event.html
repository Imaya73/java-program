<!DOCTYPE html>
<html lang="en">
    <head></head>
    <body>
        <p id="event"></p>
        <script>
            let input = document.getElementById("clipInput");
            input.oncopy = function(){
                document.getElementById('event').innerHTML="Copied"; };
            input.oncut = function(){
                document.getElementById('event').innerHTML="Cut"; };
            input.onpaste = function(){
                document.getElementById('event').innerHTML="Paste"; };
        </script>
        </body>
        </html>
